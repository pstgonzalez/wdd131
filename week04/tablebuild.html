<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Account feature comparison table">
    <meta name="author" content="Pamela S.T. González Ramírez">
    <title>Table Build | WDD 131</title>
    <link rel="stylesheet" href="styles/tablebuild.css">
</head>

<body>
    <main>
        <table>
            <caption>Table 1: Account Feature Comparison</caption>
            <thead>
                <tr>
                    <th colspan="4" scope="colgroup">
                        ACME Wildwest Services
                    </th>
                </tr>
                <tr>
                    <td></td>
                    <th scope="col">Basic</th>
                    <th scope="col">Premium</th>
                    <th scope="col">Deluxe</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th scope="row">Feature 1</th>
                    <td class="check">✔</td>
                    <td class="check">✔</td>
                    <td class="check">✔</td>
                </tr>
                <tr>
                    <th scope="row">Feature 2</th>
                    <td class="cross">✘</td>
                    <td class="check">✔</td>
                    <td class="check">✔</td>
                </tr>
                <tr>
                    <th scope="row">Feature 3</th>
                    <td class="cross">✘</td>
                    <td class="cross">✘</td>
                    <td class="check">✔</td>
                </tr>
            </tbody>
        </table>
    </main>

</body>

</html>
