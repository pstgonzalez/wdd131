
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Responsive images using the picture element.">
    <meta name="author" content="Pamela S.T. González Ramírez">
    <title>Responsive Images | WDD 131</title>
    <link rel="stylesheet" href="styles/responsive-images.css">
</head>
<body>
    <main>
        <h1>Responsive Images</h1>

        <div class="hero">
            <picture>
                <source
                    srcset="images/hero-large.webp"
                    media="(min-width: 1000px)">

                <source
                    srcset="images/hero-medium.webp"
                    media="(min-width: 500px)">

                <img
                    src="images/hero-small.webp"
                    alt="Antofagasta Chile Temple"
                    width="500"
                    height="250">
            </picture>
        </div>
    </main>
</body>
</html>
